<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SeBa online</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="base.css" />
    <script src="https://cdn.plot.ly/plotly-3.4.0.min.js" defer></script>
    <script src="base.js" type="module"></script>
  </head>
  <body>
    <header id="header">
      <nav id="nav">
        <div id="menu">
          <ul>
            <li><a href="?" data-i8n="menu-home"></a></li>
            <li><a href="?variant=single" data-i8n="menu-single"></a></li>
            <li><a href="?variant=binary" data-i8n="menu-binary"></a></li>
			<li data-i8n="menu-projects"></li>
			<li data-i8n="menu-seba"></li>
          </ul>
        </div>
        <select id="lang-switch" name="lang">
          <option value="nl" selected>🇳🇱 NL</option>
          <option value="en">🇬🇧 En</option>
        </select>
        <select id="theme-switch" name="theme">
          <option value="system" selected>🌗 System</option>
          <option value="light">☀️ Light</option>
          <option value="dark">🌙 Dark</option>
        </select>
      </nav>
      <div id="banner">
        <h1 data-i8n="seba-main-title">SeBa online</h1>
      </div>
    </header>
    <main>
      <section id="introduction" class="invisible">
        <h2 data-i8n="introduction"></h2>
        <div data-i8n="introduction-text"></div>
        <br>
        <div class="tile-container">
          <!-- Tile 1 -->
          <a href="?variant=single" class="tile-btn">
            <div class="tile-top">Launch </div>
            <div class="tile-bottom">Star Simulator </div>
          </a>
          <!-- Tile 2 -->
          <a href="?variant=binary" class="tile-btn">
            <div class="tile-top">Launch </div>
            <div class="tile-bottom">Binary Simulator</div>
          </a>
        </div>
        <br>
       <div data-i8n="introduction-text2"></div>
      </section>
      <section id="introduction-star" class="invisible">
        <h2 data-i8n="introduction-star"></h2>
        <div data-i8n="introduction-text-star"></div>
      </section>
      <section id="introduction-binary" class="invisible">
        <h2 data-i8n="introduction-binary"></h2>
        <div data-i8n="introduction-text-binary"></div>
      </section>

      <section id="controls" class="invisible">
        <h2 data-i8n="parameters"></h2>
        <form id="user-input">
          <template id="control-template">
            <div id="template-slider" class="control">
              <input
                type="range"
                id="template-range"
                step="0.01"
                data-input="template-input"
              />
              <input
                type="number"
                id="template-input"
                min="0.01"
                max="100"
                value="1"
                step="any"
                data-prec="2"
                data-range="template-range"
              />
              <div class="tooltip" id="template-tooltip">
                ⓘ <span class="tooltiptext" data-i8n="template-tooltip"></span>
              </div>
              <label for="template-input"
                ><span data-i8n="template-name"></span>(<span
                  id="template-min-value"
                ></span>
                &ndash; <span id="template-max-value"></span>)</label
              >
            </div>
          </template>
        </form>

        <button id="start-button" disabled data-i8n="start">Start</button>
        <input type="checkbox" id="direct-update" />
        <label for="direct-update"
          ><span data-i8n="update-directly"></span
        ></label>
        <div class="tooltip" id="update-directly-tooltip">
          ⓘ <span class="tooltiptext" data-i8n="update-directly-tooltip"></span>
        </div>
        <p id="status"></p>
      </section>

      <section id="graph" class="invisible">
        <h2 data-i8n="header-graph">Graph</h2>
        <div id="plotly-graph"></div>
        <div id="graph-options">
          <div class="axis-options">
            <div class="graph-style">
              <label for="graph-style" data-i8n="graph-style"></label>
              <select name="style" id="graph-style" disabled>
                <option value="linlin" data-i8n="graph-linlin"></option>
                <option value="linlog" data-i8n="graph-linlog"></option>
                <option value="loglin" data-i8n="graph-loglin"></option>
                <option
                  value="loglog"
                  selected
                  data-i8n="graph-loglog"
                ></option>
              </select>
            </div>
            <div class="axis-column">
              <label for="x-axis" data-i8n="x-axis"></label>
              <select name="xaxis" id="x-axis" disabled></select>
            </div>
            <div class="axis-column">
              <label for="y-axis" data-i8n="y-axis"></label>
              <select name="yaxis" id="y-axis" disabled></select>
            </div>
          </div>
          <div id="star-size">
            <input type="checkbox" id="show-size" disabled /><label
              for="show-size"
              data-i8n="show-star-size"
            ></label
            ><br />
            <label
              id="star-size-zoomvalue"
              class="invisible"
              for="star-size-zoomrange"
              data-i8n="scale-zoom"
            ></label>
            <input
              type="range"
              id="star-size-zoomrange"
              class="invisible"
              step="0.01"
              data-input="template-input"
              min="-2.5"
              max="2.5"
            /><br />
            <p
              id="sun-earth-scale"
              class="invisible"
              data-i8n="sun-earth-for-scale"
            ></p>
          </div>
          <svg
            id="star-size-graph"
            class="invisible"
            width="500"
            height="300"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle
              id="sun"
              cx="15"
              cy="15"
              r="10"
              fill="#ffd000"
              opacity="1"
            />
            <g transform="rotate(90, 12, 45)">
              <text x="12" y="45" fill="#999999" data-i8n="sun"></text>
            </g>
            <circle
              id="earth"
              cx="1"
              cy="15"
              r="0.1"
              fill="#008B8B"
              opacity="1"
            />
            <g transform="rotate(90, -2, 45)">
              <text x="-2" y="45" fill="#999999" data-i8n="earth"></text>
            </g>
            <line
              x1="1"
              y1="18"
              x2="1"
              y2="42"
              stroke-dasharray="0 3 0"
              stroke-width="1"
              stroke="#aaaaaa"
            />
            <circle id="star" cx="50" cy="50" r="0" fill="red" opacity="1" />
            <circle id="star2" cx="250" cy="50" r="0" fill="red" opacity="1" />
          </svg>
        </div>
      </section>

      <section id="data-section" class="invisible">
        <h2 data-i8n="header-results">Results</h2>
        <button id="download-data" data-i8n="download-data" disabled>
          Download data as CSV
        </button>
        <table id="data-table">
          <thead>
            <tr></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section id="program-log" class="invisible">
        <details>
          <summary data-i8n="program-log">Program log</summary>
          <output></output>
        </details>
      </section>
    </main>
  </body>
</html>
